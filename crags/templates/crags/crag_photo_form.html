{% extends "base.html" %}

{% block title %}Foto hinzufügen – Felsen mit Kids{% endblock %}

{% block content %}
    <h1>Foto für „{{ crag.name }}“</h1>

    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Hochladen</button>
    </form>

    <p><a href="{% url 'crags:detail' crag.pk %}">Abbrechen</a></p>
{% endblock %}

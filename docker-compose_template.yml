services:
  web:
    build:
      context: .
      dockerfile: Dockerfile

    command: >
      sh -c "python manage.py collectstatic --noinput &&
             gunicorn felsen_mit_kids.wsgi:application --bind 0.0.0.0:8000"
    # Development alternative: comment out the Gunicorn command above and uncomment this:
    # command: python manage.py runserver 0.0.0.0:8000

    ports:
      - "8000:8000"

    environment:
      DJANGO_DEBUG: "True"
      DJANGO_SECRET_KEY: "dev-only-change-me"

      POSTGRES_DB: familienfelsen
      POSTGRES_USER: familienfelsen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"

    volumes:
      - .:/app
      - ./data/media:/app/media

    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17

    environment:
      POSTGRES_DB: familienfelsen
      POSTGRES_USER: familienfelsen
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - ./data/postgres:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U familienfelsen -d familienfelsen"
        ]
      interval: 5s
      timeout: 5s
      retries: 5

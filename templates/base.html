{% load static %}

<!DOCTYPE html>
<html lang="de">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <meta
        name="description"
        content="Felsen mit Kids – familienfreundliche Kletterfelsen finden und teilen."
    >

    <title>
        {% block title %}
            Felsen mit Kids
        {% endblock %}
    </title>

    <!-- Pico CSS -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css"
    >

    <!-- Project-specific CSS -->
    <link
        rel="stylesheet"
        href="{% static 'css/main.css' %}"
    >
</head>


<body>

    <!-- Main navigation -->
    <header class="container">

        <nav>

            <ul>
                <li>
                    <strong>
                        <a
                            href="{% url 'home' %}"
                            class="brand"
                        >
                            Felsen mit Kids
                        </a>
                    </strong>
                </li>
            </ul>


            <ul>

                <li>
                    <a href="{% url 'crags:list' %}">
                        Felsen
                    </a>
                </li>

                <li>
                    <a href="{% url 'docs' %}">
                        Hilfe
                    </a>
                </li>

                <li>
                    <a
                        href="{% url 'admin:index' %}"
                        role="button"
                        class="outline"
                    >
                        Login
                    </a>
                </li>

            </ul>

        </nav>

    </header>


    <!-- Page content -->
    <main class="container">

        {% block content %}
        {% endblock %}

    </main>


    <!-- Footer -->
    <footer class="container site-footer">

        <hr>

        <div class="footer-content">

            <small>
                <strong>Felsen mit Kids</strong><br>
                Familienfreundliche Kletterfelsen
                finden und teilen.
            </small>

            <small>
                <a href="{% url 'docs' %}">
                    Dokumentation
                </a>
            </small>

        </div>

    </footer>

</body>

</html>
